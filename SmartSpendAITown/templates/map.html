<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geocard AI Town</title>
  <style>
    body {
      font-family: monospace;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 40px;
      padding-top: 40px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat({{ grid_size }}, 48px);
      grid-template-rows: repeat({{ grid_size }}, 48px);
      gap: 2px;
    }
    .tile {
      width: 48px;
      height: 48px;
      background-color: #444;
      font-size: 28px;
      text-align: center;
      line-height: 48px;
      border: 1px solid #333;
    }
    #card-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-square {
      width: 300px;
      height: 180px;
      background-color: #0074D9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card-title {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .account-text {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div style="width: 100%; text-align: center; position: fixed; top: 0; padding: 10px 0; background-color: #222; z-index: 1000;">
    
  </div>
  <div style="margin-top: 80px; display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 40px; width: 100%;">

<h1 style="color: #fff; font-size: 32px; margin-bottom: 20px; text-align: center; width: 100%;">Geocard AI Town</h1>
<div id="grid"></div>

  <div id="card-ui">
    <div class="card-square">
      <div class="card-title">💳 Debit Card</div>
      <div class="account-text">
        Linked to: {{ account or 'None' }}
      </div>
    </div>
  </div>

  <script>
    const gridSize = {{ grid_size }};
    const playerPos = {{ pos }};
    const storeMap = {{ stores | tojson }};

    const gridEl = document.getElementById("grid");

    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const tile = document.createElement("div");
        tile.className = "tile";

        const key = `${y},${x}`;
        if (playerPos[0] === y && playerPos[1] === x) {
          tile.textContent = "👧";
        } else if (key in storeMap) {
          tile.textContent = "🏪";
        } else {
          tile.textContent = "⬜";
        }

        gridEl.appendChild(tile);
      }
    }

    document.addEventListener("keydown", function(e) {
      const key = e.key.toUpperCase();
      if (["W", "A", "S", "D"].includes(key)) {
        fetch("/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: key })
        })
        .then(res => res.json())
        .then(() => location.reload());
      }
    });
  </script>
</body>
</html>
